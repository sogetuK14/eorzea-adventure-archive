<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エオルゼア冒険記録庫 Ver.0.5</title>
<style>
:root{--bg:#0f1720;--p:#1b2735;--p2:#263549;--t:#f4f6f8;--m:#aeb8c7;--a:#d9b85e;--a2:#f4dfa1;--b:#3c4d63;--d:#e17d7d}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Yu Gothic UI",sans-serif;background:linear-gradient(#101822,#0c131b);color:var(--t)}header,main,nav{max-width:1180px;margin:auto;padding:20px}h1{margin-bottom:6px}.sub,.meta,.hint{color:var(--m)}nav{padding-top:0;display:flex;gap:8px}.tab{background:#243246;color:var(--t);border:1px solid var(--b);border-radius:999px}.tab.active{background:var(--a);color:#221e13}.view{display:none}.view.active{display:block}.layout{display:grid;gap:20px}@media(min-width:960px){.layout{grid-template-columns:420px 1fr}}.panel,.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:18px}.card{background:var(--p2);margin-top:10px}label{display:block;margin:12px 0 6px;color:var(--m)}input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--b);background:var(--p2);color:var(--t)}textarea{min-height:90px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:14px;background:var(--a)}.secondary{background:#3a4659;color:var(--t)}.danger{background:transparent;border:1px solid var(--d);color:#ffb2b2}.link{background:none;padding:0;color:var(--a2);text-align:left}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}.stat{background:var(--p2);padding:12px;border-radius:10px;border:1px solid var(--b)}.stat strong{display:block;color:var(--a);font-size:1.4rem}.hero{padding:22px;border-radius:18px;border:1px solid var(--b);background:linear-gradient(135deg,rgba(217,184,94,.17),rgba(49,65,89,.85))}.progress{height:14px;background:#15202e;border-radius:999px;overflow:hidden;border:1px solid var(--b)}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));width:0}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{padding:4px 8px;border-radius:999px;background:rgba(217,184,94,.14);border:1px solid rgba(217,184,94,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--b)}.empty{padding:20px;text-align:center;border:1px dashed var(--b);border-radius:10px;color:var(--m)}.favorite{font-size:1.3rem;background:none;padding:2px 6px;color:#6d7785}.favorite.on{color:#ffd86b}.collection-grid{display:grid;gap:14px}@media(min-width:760px){.collection-grid{grid-template-columns:repeat(2,1fr)}}dialog{width:min(850px,calc(100vw - 24px));max-height:90vh;background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:14px}dialog::backdrop{background:#000b}.inside{padding:18px;max-height:86vh;overflow:auto}
</style></head><body>
<header><h1>エオルゼア冒険記録庫</h1><div class="sub">FF14を遊ぶと、図鑑が育つ。 Ver.0.5 “Archive”</div></header>
<nav><button class="tab active" data-view="home">ホーム</button><button class="tab" data-view="log">冒険ログ</button><button class="tab" data-view="collection">図鑑</button></nav>
<main>
<section id="home" class="view active"><div class="hero"><h2>おかえりなさい、はいびす。</h2><p>今日もエオルゼアの図鑑を少しずつ育てていきましょう。</p><div class="row"><span class="meta">図鑑成長度</span><span id="growthText">0%</span></div><div class="progress"><span id="growthBar"></span></div></div><div class="stats" style="margin-top:18px"><div class="stat">冒険記録<strong id="homeLogs">0</strong></div><div class="stat">コンテンツ<strong id="homeContents">0</strong></div><div class="stat">入手アイテム<strong id="homeItems">0</strong></div><div class="stat">思い出SS<strong id="homeShots">0</strong></div></div><div class="collection-grid" style="margin-top:18px"><div class="panel"><h2>今日育った図鑑</h2><div id="todayGrowth"></div></div><div class="panel"><h2>お気に入り</h2><div id="favoriteList"></div></div></div><div class="panel" style="margin-top:18px"><h2>最近の思い出</h2><div id="recentMemories"></div></div></section>
<section id="log" class="view"><div class="layout"><section class="panel"><h2>今日の冒険を登録</h2><form id="form"><label>日付</label><input id="date" type="date" required><label>コンテンツ名</label><input id="content" required><label>ルーレット</label><select id="roulette"><option value="">なし</option><option>エキスパート</option><option>ハイレベリング</option><option>レベリング</option><option>討伐・討滅戦</option><option>アライアンスレイド</option><option>ノーマルレイド</option></select><label>入手アイテム（複数可）</label><input id="items" placeholder="カード, ミニオン"><div class="hint">カンマ・読点・改行で区切れます。</div><label>思い出メモ</label><textarea id="memo"></textarea><label>SS（複数可）</label><input id="shots" type="file" accept="image/png,image/jpeg,image/webp" multiple><div id="preview" class="grid"></div><button class="primary">記録する</button></form></section><section class="panel"><h2>冒険ダッシュボード</h2><div id="contents"></div><h3>入手アイテム図鑑</h3><div id="itemsList"></div><h3>最近の思い出</h3><div id="logs"></div></section></div></section>
<section id="collection" class="view"><div class="panel"><h2>図鑑</h2><div class="collection-grid"><div><h3>コンテンツ図鑑</h3><div id="collectionContents"></div></div><div><h3>入手アイテム図鑑</h3><div id="collectionItems"></div></div></div></div></section>
</main>
<dialog id="detail"><div class="inside"><div class="row"><div><div class="meta" id="detailType"></div><h2 id="detailTitle"></h2></div><button id="closeDetail" class="secondary">閉じる</button></div><div id="detailBody"></div></div></dialog><dialog id="image"><div class="inside"><div class="row"><span></span><button id="closeImage" class="secondary">閉じる</button></div><img id="big" style="width:100%;max-height:80vh;object-fit:contain"></div></dialog>
<script>
const DB="EorzeaArchiveDB",STORE="adventureLogs",FAV="eorzeaFavoriteContents_v1",$=x=>document.getElementById(x);let urls=[];$("date").value=new Date().toISOString().slice(0,10);
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(){let d=await openDB();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}async function put(v){let d=await openDB();return new Promise((ok,no)=>{let t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(v);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function del(id){let d=await openDB();return new Promise((ok,no)=>{let t=d.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function parse(s){return [...new Set(String(s||"").split(/[,、\n]/).map(x=>x.trim()).filter(Boolean))]}function its(l){if(Array.isArray(l.items))return l.items;if(l.drop)return parse(l.drop).filter(x=>x!=="なし");return[]}function sh(l){return Array.isArray(l.screenshots)?l.screenshots:[]}function fmt(d){return d?d.replaceAll("-","/"):"-"}function sort(a){return [...a].sort((x,y)=>String(y.date).localeCompare(String(x.date))||(y.createdAt||0)-(x.createdAt||0))}function clearUrls(){urls.forEach(URL.revokeObjectURL);urls=[]}function grid(a){if(!a.length)return"";return `<div class="grid">${a.map(s=>{let f=s.file||s.image;if(!f)return"";let u=URL.createObjectURL(f);urls.push(u);return `<img src="${u}" data-url="${u}" alt="${esc(s.fileName||"SS")}">`}).join("")}</div>`}function tags(a){return a.length?`<div class="tags">${a.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}function favs(){try{return JSON.parse(localStorage.getItem(FAV))||[]}catch{return[]}}function saveFavs(v){localStorage.setItem(FAV,JSON.stringify(v))}function isFav(n){return favs().includes(n)}function toggleFav(n){let f=favs();saveFavs(f.includes(n)?f.filter(x=>x!==n):[...f,n]);render()}
function bind(){document.querySelectorAll("[data-url]").forEach(i=>i.onclick=()=>{$("big").src=i.dataset.url;$("image").showModal()});document.querySelectorAll("[data-content]").forEach(b=>b.onclick=()=>openContent(b.dataset.content));document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>openItem(b.dataset.item));document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav))}
async function render(){clearUrls();let logs=sort(await all()),cc={},ic={},ns=0;logs.forEach(l=>{cc[l.content]=(cc[l.content]||0)+1;its(l).forEach(i=>ic[i]=(ic[i]||0)+1);ns+=sh(l).length});let nc=Object.keys(cc).length,ni=Object.keys(ic).length;$("homeLogs").textContent=logs.length;$("homeContents").textContent=nc;$("homeItems").textContent=ni;$("homeShots").textContent=ns;let growth=Math.min(100,Math.round((nc*2+ni+Math.min(ns,50))/2));$("growthText").textContent=growth+"%";$("growthBar").style.width=growth+"%";let today=new Date().toISOString().slice(0,10),tl=logs.filter(l=>l.date===today);$("todayGrowth").innerHTML=tl.length?tl.map(l=>`<div class="card"><b>${esc(l.content)}</b>${tags(its(l))}<div class="meta">SS ${sh(l).length}枚</div></div>`).join(""):'<div class="empty">今日はまだ図鑑が育っていません。</div>';$("favoriteList").innerHTML=favs().length?favs().map(n=>`<div class="card row"><button class="link" data-content="${esc(n)}">${esc(n)}</button><button class="favorite on" data-fav="${esc(n)}">★</button></div>`).join(""):'<div class="empty">お気に入りはまだありません。</div>';$("recentMemories").innerHTML=logs.length?logs.slice(0,3).map(l=>`<div class="card"><b>${esc(l.content)}</b><div class="meta">${fmt(l.date)}</div>${l.memo?`<div>${esc(l.memo)}</div>`:""}${grid(sh(l))}</div>`).join(""):'<div class="empty">思い出はまだありません。</div>';let ce=Object.entries(cc).sort((a,b)=>b[1]-a[1]),ch=ce.length?ce.map(([n,c])=>`<div class="card row"><div><button class="link" data-content="${esc(n)}">${esc(n)}</button><div class="meta">${c}回挑戦</div></div><button class="favorite ${isFav(n)?"on":""}" data-fav="${esc(n)}">${isFav(n)?"★":"☆"}</button></div>`).join(""):'<div class="empty">まだ記録がありません。</div>';$("contents").innerHTML=$("collectionContents").innerHTML=ch;let ie=Object.entries(ic).sort((a,b)=>b[1]-a[1]),ih=ie.length?ie.map(([n,c])=>`<div class="card row"><button class="link" data-item="${esc(n)}">${esc(n)}</button><span>${c}回入手</span></div>`).join(""):'<div class="empty">まだ入手アイテムがありません。</div>';$("itemsList").innerHTML=$("collectionItems").innerHTML=ih;$("logs").innerHTML=logs.length?logs.map(l=>`<div class="card"><div class="row"><button class="link" data-content="${esc(l.content)}">${esc(l.content)}</button><button class="danger" data-del="${l.id}">削除</button></div><div class="meta">${fmt(l.date)}${l.roulette?" ・ "+esc(l.roulette):""}</div>${tags(its(l))}${l.memo?`<div><b>思い出：</b>${esc(l.memo)}</div>`:""}${grid(sh(l))}</div>`).join(""):'<div class="empty">最初の冒険を登録しましょう。</div>';document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("削除しますか？")){await del(b.dataset.del);render()}});bind()}
async function openContent(n){clearUrls();let ls=sort((await all()).filter(l=>l.content===n)),items=[...new Set(ls.flatMap(its))],shots=ls.flatMap(sh);$("detailType").textContent="コンテンツ図鑑";$("detailTitle").textContent=n;$("detailBody").innerHTML=`<div class="stats"><div class="stat">挑戦回数<strong>${ls.length}回</strong></div><div class="stat">初回<strong>${fmt(ls.at(-1)?.date)}</strong></div><div class="stat">最終<strong>${fmt(ls[0]?.date)}</strong></div><div class="stat">SS<strong>${shots.length}枚</strong></div></div><button class="favorite ${isFav(n)?"on":""}" data-fav="${esc(n)}">${isFav(n)?"★ お気に入り済み":"☆ お気に入りに追加"}</button><h3>入手アイテム</h3>${items.length?`<div class="tags">${items.map(i=>`<button class="link" data-item="${esc(i)}">${esc(i)}</button>`).join("")}</div>`:'<div class="empty">なし</div>'}<h3>関連SS</h3>${shots.length?grid(shots):'<div class="empty">なし</div>'}<h3>履歴</h3>${ls.map(l=>`<div class="card"><b>${fmt(l.date)}</b>${tags(its(l))}${l.memo?`<div>${esc(l.memo)}</div>`:""}${grid(sh(l))}</div>`).join("")}`;bind();$("detail").showModal()}
async function openItem(n){clearUrls();let ls=sort((await all()).filter(l=>its(l).includes(n))),shots=ls.flatMap(sh),cs=[...new Set(ls.map(l=>l.content))];$("detailType").textContent="入手アイテム図鑑";$("detailTitle").textContent=n;$("detailBody").innerHTML=`<div class="stats"><div class="stat">入手回数<strong>${ls.length}回</strong></div><div class="stat">初回<strong>${fmt(ls.at(-1)?.date)}</strong></div><div class="stat">最終<strong>${fmt(ls[0]?.date)}</strong></div><div class="stat">関連SS<strong>${shots.length}枚</strong></div></div><h3>関連コンテンツ</h3><div class="tags">${cs.map(c=>`<button class="link" data-content="${esc(c)}">${esc(c)}</button>`).join("")}</div><h3>関連SS</h3>${shots.length?grid(shots):'<div class="empty">なし</div>'}`;bind();$("detail").showModal()}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));t.classList.add("active");$(t.dataset.view).classList.add("active")});$("shots").onchange=()=>{clearUrls();$("preview").innerHTML=grid([...$("shots").files].map(file=>({file,fileName:file.name})));bind()};$("form").onsubmit=async e=>{e.preventDefault();let c=$("content").value.trim();if(!c)return;let shots=[...$("shots").files].map(file=>({id:crypto.randomUUID(),fileName:file.name,file}));await put({id:crypto.randomUUID(),date:$("date").value,content:c,roulette:$("roulette").value,items:parse($("items").value),memo:$("memo").value.trim(),screenshots:shots,createdAt:Date.now()});$("content").value=$("items").value=$("memo").value="";$("roulette").value="";$("shots").value="";$("preview").innerHTML="";render()};$("closeDetail").onclick=()=>$("detail").close();$("closeImage").onclick=()=>$("image").close();render();
</script></body></html>
