<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>エオルゼア冒険記録庫 v0.8.2</title>
<style>
:root{--p:#182431;--p2:#223247;--t:#f5f7f9;--m:#aeb8c7;--a:#d9b85e;--b:#3a4d64;--d:#df7a7a;--s:#88c99a}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:var(--t);background:linear-gradient(#101822,#0b1118);min-height:100vh}header,nav,main{max-width:1280px;margin:auto;padding:20px}header{padding-bottom:10px}h1{margin:0}.sub,.meta,.small,label{color:var(--m)}nav{display:flex;gap:8px;flex-wrap:wrap;padding-top:0}.tab{background:#223044;color:var(--t);border:1px solid var(--b);padding:10px 14px;border-radius:999px}.tab.active{background:var(--a);color:#241f13}.view{display:none}.view.active{display:block}.layout{display:grid;gap:20px}@media(min-width:1040px){.layout{grid-template-columns:430px 1fr}}.panel,.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:18px}.card{background:var(--p2);margin-top:10px}label{display:block;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--b);background:var(--p2);color:var(--t);font:inherit}textarea{min-height:90px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:14px;background:var(--a)}.danger{background:transparent;border:1px solid var(--d);color:#ffb2b2}.secondary{background:#3a4659;color:var(--t)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.stats{grid-template-columns:repeat(4,1fr)}}.stat{background:var(--p2);padding:13px;border-radius:10px;border:1px solid var(--b)}.stat strong{display:block;color:var(--a);font-size:1.4rem}.progress{height:14px;background:#15202e;border-radius:999px;overflow:hidden;border:1px solid var(--b)}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--a),#f4dfa1)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{padding:4px 8px;border-radius:999px;background:#26384c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.notice{display:none;background:#183d2b;padding:10px;border-radius:8px}.notice.show{display:block}.achievement{border-left:4px solid var(--s)}.count{color:var(--a);font-weight:800}.hero{padding:22px;border-radius:18px;border:1px solid var(--b);background:linear-gradient(135deg,rgba(217,184,94,.17),rgba(46,66,90,.88))}.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.inline{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>エオルゼア冒険記録庫</h1><div class="sub">現在値から、遊んだ分だけ正しく育つ。 v0.8.2 “Baseline Sync”</div></header>
<nav><button class="tab active" data-view="home">ホーム</button><button class="tab" data-view="log">行動ログ</button><button class="tab" data-view="achievements">アチーブ</button><button class="tab" data-view="leveling">レベリング</button><button class="tab" data-view="masters">マスター</button></nav>
<main>
<section id="home" class="view active"><div class="hero"><h2>おかえりなさい。</h2><p>ゲーム内の現在値を起点に、追加したログ分だけ正しく育ちます。</p></div><div class="stats" style="margin-top:18px"><div class="stat">行動ログ<strong id="homeLogs">0</strong></div><div class="stat">登録コンテンツ<strong id="homeContents">0</strong></div><div class="stat">登録ジョブ<strong id="homeJobs">0</strong></div><div class="stat">達成アチーブ<strong id="homeCompleted">0</strong></div></div><div class="panel" style="margin-top:18px"><h2>最近育ったもの</h2><div id="recentGrowth"></div></div><div class="panel" style="margin-top:18px"><h2>アチーブ進捗</h2><div id="homeAchievements"></div></div></section>
<section id="log" class="view"><div class="layout"><section class="panel"><h2>行動を記録</h2><div id="notice" class="notice"></div><form id="logForm"><label>日付</label><input id="date" type="date" required><label>行動種別</label><select id="actionType"><option value="content">コンテンツ参加</option><option value="collectable">収集品納品</option></select><div id="contentFields"><label>コンテンツ</label><select id="contentSelect"></select><label>参加ジョブ</label><select id="jobSelect"></select><label>結果</label><select id="result"><option>参加</option><option>クリア</option><option>未クリア</option><option>完了</option></select><div id="resurrectionWrap" style="display:none"><label>蘇生回数</label><input id="resurrectionCount" type="number" min="0" value="0"></div><label>今回獲得経験値</label><input id="earnedExp" type="number" min="0" value="0"></div><div id="collectableFields" style="display:none"><label>クラス</label><select id="collectableJob"></select><label>納品数</label><input id="collectableCount" type="number" min="1" value="1"><label>今回獲得経験値</label><input id="collectableExp" type="number" min="0" value="0"></div><label>思い出メモ</label><textarea id="memo"></textarea><label>SS（複数可）</label><input id="shots" type="file" accept="image/png,image/jpeg,image/webp" multiple><button class="primary">保存する</button></form></section><section class="panel"><h2>最近の行動ログ</h2><div id="logs"></div></section></div></section>
<section id="achievements" class="view"><div class="layout"><section class="panel"><h2>アチーブ現在値</h2><form id="baselineForm"><label>アチーブ</label><select id="baselineAchievement"></select><label>ゲーム内の現在値</label><input id="baselineValue" type="number" min="0" value="0"><button class="primary">現在値を保存</button></form></section><section class="panel"><h2>アチーブ進捗</h2><div id="achievementList"></div></section></div></section>
<section id="leveling" class="view"><div class="layout"><section class="panel"><h2>ジョブ経験値の現在値</h2><form id="levelForm"><label>ジョブ</label><select id="levelJob"></select><div class="inline"><div><label>現在レベル</label><input id="currentLevel" type="number" min="1" max="100" value="1"></div><div><label>現在経験値</label><input id="currentExp" type="number" min="0" value="0"></div></div><label>次のレベルまでの必要経験値</label><input id="neededExp" type="number" min="1" value="1000"><button class="primary">レベル情報を保存</button></form></section><section class="panel"><h2>レベリング状況</h2><div id="levelingList"></div></section></div></section>
<section id="masters" class="view"><div class="layout"><section class="panel"><h2>ジョブマスター</h2><form id="jobForm"><label>ジョブ名</label><input id="jobName" required><label>ロール</label><select id="jobRole"><option>タンク</option><option>ヒーラー</option><option>近接DPS</option><option>遠隔物理DPS</option><option>遠隔魔法DPS</option><option>クラフター</option><option>ギャザラー</option></select><button class="primary">ジョブ追加</button></form><div id="jobList"></div></section><section class="panel"><h2>コンテンツマスター</h2><form id="contentForm"><label>コンテンツ名</label><input id="contentName" required><label>大分類</label><select id="contentCategory"><option>バトル</option><option>ギャザクラ</option><option>手帳</option><option>その他</option></select><label>小分類</label><select id="contentSubcategory"><option>ID</option><option>討伐・討滅戦</option><option>ノーマルレイド</option><option>アライアンスレイド</option><option>零式</option><option>絶</option><option>制作</option><option>採集</option><option>リーヴ</option><option>その他</option></select><label><input id="highDifficulty" type="checkbox" style="width:auto"> 高難易度として扱う</label><button class="primary">コンテンツ追加</button></form><div id="contentList"></div></section><section class="panel"><h2>アチーブマスター</h2><form id="achievementForm"><label>アチーブ名</label><input id="achievementName" required><label>目標値</label><input id="achievementTarget" type="number" min="1" value="10"><label>集計ルール</label><select id="achievementRule"><option value="all_content">コンテンツ参加回数</option><option value="id_content">ID参加回数</option><option value="raid_content">レイド参加回数</option><option value="high_difficulty">高難易度参加回数</option><option value="tank_high_difficulty">タンクで高難易度参加回数</option><option value="healer_resurrection">ヒーラー蘇生回数</option><option value="collectable_delivery">収集品納品数</option><option value="craft_complete">制作完了回数</option></select><button class="primary">アチーブ追加</button></form><div id="achievementMasterList"></div></section></div></section>
</main>
<script>
const DB="EorzeaArchiveDB_v08",STORE="actionLogs",JOBS="eorzeaJobs_v081",CONTENTS="eorzeaContents_v081",ACH="eorzeaAchievements_v082",BASE="eorzeaAchievementBaselines_v082",LEVELS="eorzeaJobLevels_v082";const $=i=>document.getElementById(i);$("date").value=new Date().toISOString().slice(0,10);
function gj(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function sj(k,v){localStorage.setItem(k,JSON.stringify(v))}function jobs(){return gj(JOBS)}function contents(){return gj(CONTENTS)}function ach(){return gj(ACH)}function baselines(){return gj(BASE)}function levels(){return gj(LEVELS)}
function db(){return new Promise((o,n)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"})};r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}async function logs(){let d=await db();return new Promise((o,n)=>{let r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>o(r.result||[]);r.onerror=()=>n(r.error)})}async function put(v){let d=await db();return new Promise((o,n)=>{let t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(v);t.oncomplete=o;t.onerror=()=>n(t.error)})}async function del(id){let d=await db();return new Promise((o,n)=>{let t=d.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=o;t.onerror=()=>n(t.error)})}
function e(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}function role(r){return ["近接DPS","遠隔物理DPS","遠隔魔法DPS"].includes(r)?"DPS":r}function base(id){return baselines().find(x=>x.achievementId===id)?.value||0}
function seed(){if(!jobs().length){let a=[["ナイト","タンク"],["戦士","タンク"],["暗黒騎士","タンク"],["ガンブレイカー","タンク"],["バスティオン","タンク"],["白魔道士","ヒーラー"],["学者","ヒーラー"],["占星術師","ヒーラー"],["賢者","ヒーラー"],["木工師","クラフター"],["鍛冶師","クラフター"],["甲冑師","クラフター"],["彫金師","クラフター"],["革細工師","クラフター"],["裁縫師","クラフター"],["錬金術師","クラフター"],["調理師","クラフター"],["採掘師","ギャザラー"],["園芸師","ギャザラー"],["漁師","ギャザラー"]];sj(JOBS,a.map(([name,role])=>({id:crypto.randomUUID(),name,role}))) }if(!ach().length)sj(ACH,[{id:crypto.randomUUID(),name:"コンテンツ参加",target:10,rule:"all_content"},{id:crypto.randomUUID(),name:"ID参加",target:10,rule:"id_content"},{id:crypto.randomUUID(),name:"レイド参加",target:10,rule:"raid_content"},{id:crypto.randomUUID(),name:"高難易度参加",target:10,rule:"high_difficulty"},{id:crypto.randomUUID(),name:"タンクで高難易度",target:10,rule:"tank_high_difficulty"},{id:crypto.randomUUID(),name:"ヒーラー蘇生",target:100,rule:"healer_resurrection"},{id:crypto.randomUUID(),name:"収集品納品",target:100,rule:"collectable_delivery"},{id:crypto.randomUUID(),name:"制作完了",target:100,rule:"craft_complete"}])}
function calc(rule,ls){return ls.reduce((s,l)=>{let r=role(l.role),raid=["ノーマルレイド","アライアンスレイド","零式","絶"].includes(l.contentSubcategory);if(rule==="all_content"&&l.actionType==="content")return s+1;if(rule==="id_content"&&l.contentSubcategory==="ID")return s+1;if(rule==="raid_content"&&raid)return s+1;if(rule==="high_difficulty"&&l.highDifficulty)return s+1;if(rule==="tank_high_difficulty"&&l.highDifficulty&&r==="タンク")return s+1;if(rule==="healer_resurrection"&&r==="ヒーラー")return s+(+l.resurrectionCount||0);if(rule==="collectable_delivery"&&l.actionType==="collectable")return s+(+l.count||0);if(rule==="craft_complete"&&l.contentSubcategory==="制作"&&l.result==="完了")return s+1;return s},0)}
function allowed(c){if(!c)return[];if(c.category==="バトル")return jobs().filter(j=>!["クラフター","ギャザラー"].includes(j.role));if(c.subcategory==="制作")return jobs().filter(j=>j.role==="クラフター");if(c.subcategory==="採集")return jobs().filter(j=>j.role==="ギャザラー");return jobs()}
function applyExp(id,x){if(!id||!x)return;let a=levels(),d=a.find(v=>v.jobId===id);if(!d)return;d.currentExp+=+x||0;while(d.currentLevel<100&&d.currentExp>=d.neededExp){d.currentExp-=d.neededExp;d.currentLevel++}sj(LEVELS,a)}
function select(){ $("contentSelect").innerHTML='<option value="">選択</option>'+contents().map(c=>`<option value="${c.id}">${e(c.name)}（${e(c.subcategory)}）</option>`).join("");$("collectableJob").innerHTML='<option value="">選択</option>'+jobs().filter(j=>["クラフター","ギャザラー"].includes(j.role)).map(j=>`<option value="${j.id}">${e(j.name)}</option>`).join("");$("baselineAchievement").innerHTML=ach().map(a=>`<option value="${a.id}">${e(a.name)}</option>`).join("");$("levelJob").innerHTML=jobs().map(j=>`<option value="${j.id}">${e(j.name)}</option>`).join("")}
function jobselect(){let c=contents().find(x=>x.id===$("contentSelect").value);$("jobSelect").innerHTML='<option value="">選択</option>'+allowed(c).map(j=>`<option value="${j.id}">${e(j.name)}（${e(j.role)}）</option>`).join("")}function res(){let j=jobs().find(x=>x.id===$("jobSelect").value);$("resurrectionWrap").style.display=j?.role==="ヒーラー"?"block":"none"}
async function render(){select();let ls=(await logs()).sort((a,b)=>String(b.date).localeCompare(String(a.date))),as=ach();$("homeLogs").textContent=ls.length;$("homeContents").textContent=contents().length;$("homeJobs").textContent=jobs().length;$("homeCompleted").textContent=as.filter(a=>base(a.id)+calc(a.rule,ls)>=a.target).length;$("recentGrowth").innerHTML=ls.slice(0,5).map(l=>`<div class="card"><b>${e(l.contentName||"収集品納品")}</b><div class="meta">${e(l.jobName||"")}</div>${l.resurrectionCount?`<div class="tags"><span class="tag">蘇生 ${l.resurrectionCount}</span></div>`:""}${l.earnedExp?`<div class="tags"><span class="tag">経験値 +${l.earnedExp}</span></div>`:""}</div>`).join("")||'<div class="card">まだログがありません。</div>';let ah=as.map(a=>{let b=base(a.id),x=calc(a.rule,ls),t=b+x,p=Math.min(100,Math.round(t/a.target*100));return `<div class="card achievement"><div class="row"><b>${e(a.name)}</b><span class="count">${t}/${a.target}</span></div><div class="small">現在値 ${b} ＋ ログ ${x}</div><div class="progress"><span style="width:${p}%"></span></div></div>`}).join("");$("homeAchievements").innerHTML=$("achievementList").innerHTML=ah;$("logs").innerHTML=ls.map(l=>`<div class="card"><div class="row"><b>${e(l.contentName||"収集品納品")}</b><button class="danger" data-del="${l.id}">削除</button></div><div class="meta">${e(l.jobName||"")} ${e(l.result||"")}</div>${l.resurrectionCount?`蘇生 ${l.resurrectionCount}回<br>`:""}${l.earnedExp?`経験値 +${l.earnedExp}<br>`:""}${e(l.memo||"")}</div>`).join("");$("levelingList").innerHTML=levels().map(d=>{let j=jobs().find(x=>x.id===d.jobId),p=Math.min(100,Math.round(d.currentExp/d.neededExp*100));return `<div class="card"><div class="row"><b>${e(j?.name||"不明")}</b><span class="count">Lv.${d.currentLevel}</span></div><div>${d.currentExp}/${d.neededExp}</div><div class="progress"><span style="width:${p}%"></span></div></div>`}).join("")||'<div class="card">レベル情報を登録してください。</div>';$("jobList").innerHTML=jobs().map(j=>`<div class="card row"><div><b>${e(j.name)}</b><div class="small">${e(j.role)}</div></div></div>`).join("");$("contentList").innerHTML=contents().map(c=>`<div class="card"><b>${e(c.name)}</b><div class="small">${e(c.category)} / ${e(c.subcategory)}</div></div>`).join("");$("achievementMasterList").innerHTML=as.map(a=>`<div class="card rule"><b>${e(a.name)}</b><div class="small">${e(a.rule)}</div></div>`).join("");document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await del(b.dataset.del);render()})}
$("contentSelect").onchange=()=>{jobselect();res()};$("jobSelect").onchange=res;$("actionType").onchange=()=>{let c=$("actionType").value==="content";$("contentFields").style.display=c?"block":"none";$("collectableFields").style.display=c?"none":"block"};
$("logForm").onsubmit=async ev=>{ev.preventDefault();let type=$("actionType").value,l={id:crypto.randomUUID(),date:$("date").value,actionType:type,memo:$("memo").value,createdAt:Date.now()};if(type==="content"){let c=contents().find(x=>x.id===$("contentSelect").value),j=jobs().find(x=>x.id===$("jobSelect").value);if(!c||!j)return;let xp=+$("earnedExp").value||0;Object.assign(l,{contentId:c.id,contentName:c.name,contentCategory:c.category,contentSubcategory:c.subcategory,highDifficulty:c.highDifficulty,jobId:j.id,jobName:j.name,role:j.role,result:$("result").value,resurrectionCount:j.role==="ヒーラー"?+$("resurrectionCount").value||0:0,earnedExp:xp});applyExp(j.id,xp)}else{let j=jobs().find(x=>x.id===$("collectableJob").value);if(!j)return;let xp=+$("collectableExp").value||0;Object.assign(l,{jobId:j.id,jobName:j.name,role:j.role,count:+$("collectableCount").value||1,earnedExp:xp});applyExp(j.id,xp)}await put(l);$("notice").textContent="保存して再集計しました。";$("notice").classList.add("show");setTimeout(()=>$("notice").classList.remove("show"),2000);render()};
$("baselineForm").onsubmit=ev=>{ev.preventDefault();let id=$("baselineAchievement").value,a=baselines().filter(x=>x.achievementId!==id);a.push({achievementId:id,value:+$("baselineValue").value||0});sj(BASE,a);render()};$("levelForm").onsubmit=ev=>{ev.preventDefault();let id=$("levelJob").value,a=levels().filter(x=>x.jobId!==id);a.push({jobId:id,currentLevel:+$("currentLevel").value||1,currentExp:+$("currentExp").value||0,neededExp:+$("neededExp").value||1});sj(LEVELS,a);render()};
$("jobForm").onsubmit=ev=>{ev.preventDefault();let a=jobs();a.push({id:crypto.randomUUID(),name:$("jobName").value,role:$("jobRole").value});sj(JOBS,a);render()};$("contentForm").onsubmit=ev=>{ev.preventDefault();let a=contents();a.push({id:crypto.randomUUID(),name:$("contentName").value,category:$("contentCategory").value,subcategory:$("contentSubcategory").value,highDifficulty:$("highDifficulty").checked});sj(CONTENTS,a);render()};$("achievementForm").onsubmit=ev=>{ev.preventDefault();let a=ach();a.push({id:crypto.randomUUID(),name:$("achievementName").value,target:+$("achievementTarget").value||1,rule:$("achievementRule").value});sj(ACH,a);render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.view).classList.add('active')});seed();render();jobselect();
</script></body></html>
